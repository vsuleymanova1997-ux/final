<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ECTC E-Board Assistant</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; background: #f6f5f2; color: #1f2a24;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: #15423a; color: #fff; padding: 16px 24px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #cfe3da; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; margin: 0 auto; width: 100%;
    box-sizing: border-box;
  }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; max-width: 75%; white-space: pre-wrap;
    line-height: 1.4; font-size: 14px;
  }
  .msg.user .bubble { background: #15423a; color: #fff; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #ddd; }
  .msg.system .bubble { background: #fff6e0; border: 1px solid #e8d79a; font-style: italic; }
  form {
    display: flex; gap: 8px; padding: 16px; max-width: 760px; margin: 0 auto; width: 100%;
    box-sizing: border-box; border-top: 1px solid #ddd; background: #fff;
  }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px;
  }
  button {
    padding: 10px 18px; border-radius: 8px; border: none; background: #15423a; color: #fff;
    font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .examples { padding: 8px 20px; max-width: 760px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  .examples button {
    background: #e7efe9; color: #15423a; border: 1px solid #c7d8cd; font-size: 12px; padding: 6px 10px;
    margin: 4px 6px 0 0; border-radius: 999px;
  }
</style>
</head>
<body>
  <header>
    <h1>Elm City Tutoring Corps — E-Board Assistant</h1>
    <p>Ask about budget, reimbursements, the tutor roster, or the tutee waitlist.</p>
  </header>
  <div class="examples" id="examples"></div>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="e.g. Can Ben Okafor tutor solo right now?" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const examplesEl = document.getElementById('examples');
let sessionId = null;

const EXAMPLES = [
  "How much is left in the tutoring_supplies budget?",
  "Review r04_injection_approve_all.txt",
  "Which tutors have an expired or pending background check?",
  "Which families have been waiting longest for a match?",
  "How do I get reimbursed for supplies?",
];

for (const ex of EXAMPLES) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = ex;
  b.onclick = () => { input.value = ex; form.requestSubmit(); };
  examplesEl.appendChild(b);
}

function addMessage(role, text) {
  const row = document.createElement('div');
  row.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage('user', message);
  input.value = '';
  sendBtn.disabled = true;
  addMessage('system', 'Thinking…');
  const thinkingNode = chat.lastChild;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    sessionId = data.session_id;
    thinkingNode.remove();
    addMessage('assistant', data.reply);
  } catch (err) {
    thinkingNode.remove();
    addMessage('system', `Error: ${err.message}`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
